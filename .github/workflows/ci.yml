# Runs the same gates as `make check` plus the offline demo.
# Not yet executed: the repository has not been pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make check (fmt, vet, lint, race tests, coverage >= 80%)
        run: make check
      - name: make demo
        run: make demo
      - name: tamper evaluation
        if: matrix.os == 'ubuntu-latest'
        run: make eval
