version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        # Terminal/report output: a failed write to stdout is not actionable.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    gosec:
      excludes:
        # A forensic collector's job is to read files at caller-chosen
        # paths; every such read goes through pkg/fsroot confinement.
        - G304
        # Integer conversions are bounds-checked where inputs are untrusted
        # (utmp/procfs parsers); the rest are sizes from len().
        - G115
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, gocritic, revive]
      - path: internal/fixtures/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SlateGitOrg/evidencelocker
